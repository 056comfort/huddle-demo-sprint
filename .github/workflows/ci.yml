name: CI
 
# Runs on every push and PR - catches broken code before it reaches main,
# and before Render/Vercel ever try to deploy it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Lint
        run: npm run lint
 
      - name: Build
        run: npm run build
 
      - name: Run tests
        run: npm test --if-present
 
  backend:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest
    # Backend code lives in /backend, matching Render's Root Directory setting.
    defaults:
      run:
        working-directory: backend
    env:
      # These must be set as repository secrets (Settings > Secrets and variables >
      # Actions > New repository secret). DATABASE_URL is needed even for the build
      # step (Prisma's config loader requires it to resolve), and genuinely needed
      # for auth.test.ts to connect and pass rather than fail with ECONNREFUSED.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 5000
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Type-check
        run: npx tsc --noEmit
 
      - name: Build
        run: npm run build
 
      - name: Run tests
        run: npm test --if-present
 